# ============================================================================
# tmux >= 2.4: options and commands that older tmux rejects
# ============================================================================
# Loaded by tmux.conf. The counterpart for older tmux (Amazon Linux 2 ships
# 1.8) is tmux-legacy.conf; keep the two in step when changing the theme or
# key bindings.

# Mouse (the single `mouse` option replaced mode-mouse etc. in 2.1)
set-option -g mouse on

# Focus events enabled for terminals that support them (1.9+)
set -g focus-events on

# Pass extended key sequences (e.g. C-Enter, C-S-letter as CSI u) to
# applications that ask for them (3.2+). Without it tmux folds them into the
# plain keys.
if-shell 'sh ~/.config/tmux/tmux-version-ge 3.2' 'set -s extended-keys on'

# ============================================================================
# Terminal and Color Settings
# ============================================================================

# True color: `Tc` is understood from 2.2, `RGB` from 3.2. Unknown flags are
# ignored, so both are listed.
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-256color:RGB"

# ============================================================================
# Gruvbox Material Theme, matching Ghostty's built-in `Gruvbox Material`
# ============================================================================

# Palette (Ghostty theme `Gruvbox Material`)
# bg: #1d2021, bar: #32302f (a step lighter than bg), fg: #d4be98
# dim: #a89984, muted: #4c4c4c (bright black)
# selection: #2b2c3f with #7cfb70 text, red: #ea6926, green: #c1d041
# yellow: #eecf75, blue: #6da3ec

# Status bar position and basic styling
set-option -g status-position bottom
set-option -g status-style "fg=#d4be98,bg=#32302f"
set-option -g status-interval 5

# Status bar left side - session info
set-option -g status-left-length 40
set-option -g status-left "#[fg=#1d2021,bg=#c1d041,bold] #S #[fg=#c1d041,bg=#32302f]"

# Status bar right side - system info
set-option -g status-right-length 80
set-option -g status-right "#[fg=#a89984,bg=#32302f] %Y-%m-%d #[fg=#d4be98]%H:%M #[fg=#eecf75,bg=#32302f]#[fg=#1d2021,bg=#eecf75,bold] #h "

# Window status styling
set-window-option -g window-status-style "fg=#a89984,bg=#32302f"
set-window-option -g window-status-current-style "fg=#1d2021,bg=#6da3ec,bold"
set-window-option -g window-status-activity-style "fg=#ea6926,bg=#32302f"
set-window-option -g window-status-bell-style "fg=#1d2021,bg=#ea6926,bold"

# Window status format
set-window-option -g window-status-format " #I:#W#{?window_flags,#{window_flags}, } "
set-window-option -g window-status-current-format " #I:#W#{?window_flags,#{window_flags}, } "

# Pane border colors
set-option -g pane-border-style "fg=#4c4c4c"
set-option -g pane-active-border-style "fg=#6da3ec"

# Message styling: the `:` prompt and messages replace the status line, so
# draw them like the terminal itself (plain fg on bg) for readability.
set-option -g message-style "fg=#d4be98,bg=#1d2021"
set-option -g message-command-style "fg=#c1d041,bg=#1d2021"

# Copy mode styling (same selection colours as Ghostty)
set-window-option -g mode-style "fg=#7cfb70,bg=#2b2c3f"

# Clock mode color
set-window-option -g clock-mode-colour "#c1d041"

# ============================================================================
# Key Bindings
# ============================================================================

# New windows and splits start in the current path (-c needs 1.9+)
bind c new-window -c "#{pane_current_path}"  # Create new window in current path
bind '"' split-window -c "#{pane_current_path}"  # Split horizontal in current path
bind % split-window -h -c "#{pane_current_path}"  # Split vertical in current path

# Better pane splitting
# \ and - are on the Miryoku NUM layer with the prefix; | needs SYM + shift.
bind | split-window -h -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Shift+PgUp scrolls back without the prefix (NAV layer: hold Space, left
# index Shift, PgUp on the right hand).
bind -n S-PPage copy-mode -eu

# Mod-free selection keys, plus Miryoku's default clipboard keys
# (Copy = C-Insert, Cut = S-Delete) on the NAV and BUTTON layers.
# Key tables (-T) and `send-keys -X` need 2.4+.
bind -T copy-mode v    send-keys -X begin-selection
bind -T copy-mode y    send-keys -X copy-selection-and-cancel
bind -T copy-mode C-IC send-keys -X copy-selection-and-cancel
bind -T copy-mode S-DC send-keys -X copy-selection-and-cancel

# ============================================================================
# Plugin Management (TPM, needs 1.9+)
# ============================================================================

# List of plugins. tmux-sensible is not used: everything it sets is set in
# tmux.conf (display-time and C-n/C-p were the only additions).
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugin settings
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TMUX plugin manager (keep this at the very bottom). TPM defaults
# to ~/.config/tmux/plugins for an XDG config, so point it at the XDG data dir
# it is installed in. Skipped until TPM is cloned, instead of erroring:
#   git clone https://github.com/tmux-plugins/tpm ~/.local/share/tmux/plugins/tpm
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins/'
if-shell 'test -x ~/.local/share/tmux/plugins/tpm/tpm' \
    "run '~/.local/share/tmux/plugins/tpm/tpm'"

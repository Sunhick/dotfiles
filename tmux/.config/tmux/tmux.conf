# ============================================================================
# tmux Configuration - XDG Compliant with Gruvbox Theme
# ============================================================================
#
# This file holds the settings that every supported tmux understands. The
# parts that depend on the tmux version live in two files that are loaded at
# the bottom:
#
#   tmux-modern.conf   tmux >= 2.4  (macOS, current distros)
#   tmux-legacy.conf   tmux <  2.4  (Amazon Linux 2 ships 1.8)
#
# tmux-version-ge is the helper that picks between them.
#
# XDG Base Directory Specification compliance
# Note: tmux 3.1+ automatically looks for config in $XDG_CONFIG_HOME/tmux/tmux.conf
# Older versions only read ~/.tmux.conf; either add a ~/.tmux.conf containing
#   source-file ~/.config/tmux/tmux.conf
# or start tmux with: tmux -f ~/.config/tmux/tmux.conf

# ============================================================================
# General Settings
# ============================================================================

# Change prefix key to backtick (more accessible than Ctrl-b)
#
# Miryoku (QWERTY): ` sits on the NUM layer (hold Backspace thumb, left
# pinky bottom). Digits, [ ] ; = \ - . and 0 share that layer, so most
# prefix commands below are reachable without releasing the thumb:
#   ` 1..9  window    ` [ copy-mode   ` ] paste    ` ; last pane
#   ` \     h-split   ` - v-split     ` = buffers
unbind C-b
set-option -g prefix `
bind ` send-prefix

# Emacs style key bindings
set -g mode-keys emacs
set -g status-keys emacs

# Start windows and panes at 1, not 0 (easier to reach)
set -g base-index 1
set -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Don't allow programs to rename windows
set-option -g allow-rename off

# Increase scrollback buffer size
set -g history-limit 50000

# Reduce escape time for faster command sequences
set -sg escape-time 0

# Increase repeat time for repeatable commands
set -g repeat-time 1000

# Pass modified arrows/Home/End (e.g. S-Left for Emacs windmove) to apps
setw -g xterm-keys on

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# Set terminal type with 256 color support
set -g default-terminal "tmux-256color"

# ============================================================================
# Key Bindings
# ============================================================================

# Reload configuration
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Pane navigation (vi-style letters)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane navigation with arrows (Miryoku NAV layer: hold Space, arrows on
# J K L '). Repeatable, so ` then several arrows within repeat-time.
bind -r Left  select-pane -L
bind -r Down  select-pane -D
bind -r Up    select-pane -U
bind -r Right select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
# No root-table M-1..9 / M-n / M-p: they shadowed Emacs digit-argument and
# M-n/M-p history in readline, the minibuffer and comint. On Miryoku a
# Meta+digit chord also needs NUM thumb + Alt + digit; ` <digit> (built-in)
# stays on the NUM layer instead.
bind -r n next-window
bind -r p previous-window
bind Tab last-window

# Session management
bind C-s choose-session
bind N new-session

# Copy mode improvements
bind Enter copy-mode  # Enter copy mode

# Send copies to the system clipboard via OSC 52. Works locally on macOS
# and over SSH from the Mac to Linux hosts (iTerm2: General > Selection >
# "Applications in terminal may access clipboard").
set -s set-clipboard on

# Clear screen and history
bind C-l send-keys 'C-l' \; clear-history

# Toggle synchronize panes
bind S setw synchronize-panes

# ============================================================================
# Version-dependent settings
# ============================================================================
# Mouse, theme, new-pane-in-current-path, copy-mode selection keys and the
# plugin manager. Keep this at the very bottom: tmux-modern.conf ends with the
# TPM `run` line, which has to come last.

if-shell 'sh ~/.config/tmux/tmux-version-ge 2.4' 'source-file ~/.config/tmux/tmux-modern.conf' 'source-file ~/.config/tmux/tmux-legacy.conf'

# ============================================================================
# tmux < 2.4: written for tmux 1.8 (Amazon Linux 2)
# ============================================================================
# Loaded by tmux.conf. Counterpart of tmux-modern.conf; keep the two in step
# when changing the theme or key bindings.
#
# What differs from tmux-modern.conf on old tmux:
#   - no hex colors: the Gruvbox Material Dark palette is mapped to the nearest 256-color
#     index (colourNNN)
#   - separate status-fg / status-bg / status-attr options instead of
#     status-style (styles arrived in 1.9)
#   - no #{?...} format conditionals, no #{pane_current_path} in `-c`, no
#     focus-events (all 1.9+)
# Key bindings are the same keys with the same effect as tmux-modern.conf;
# only the command syntax differs.
#   - mouse is mode-mouse + mouse-* until 2.1
#   - copy-mode keys live in the emacs-copy table (-t) until 2.4

# Mouse
if-shell 'sh ~/.config/tmux/tmux-version-ge 2.1' 'set-option -g mouse on' 'set-option -g mode-mouse on ; set-option -g mouse-resize-pane on ; set-option -g mouse-select-pane on ; set-option -g mouse-select-window on'

# ============================================================================
# Gruvbox Material Dark Theme (256-color approximation of tmux-modern.conf)
# ============================================================================

# bg #282828 = colour235 (status bar too)   fg #d4be98 = colour180
# dim #a89984 = colour144   muted #7c6f64 = colour243
# selection #d4be98 (colour180) with #282828 (colour235) text
# red #ea6962 = colour167   green #a9b665 = colour143
# yellow #d8a657 = colour179   blue #7daea3 = colour109
# (colour138, the nearest for dim, is pink, so dim uses colour144; muted's
# nearest, colour95, is pink too, so it uses the grey colour243.)

# Status bar position and basic styling
set-option -g status-position bottom
set-option -g status-fg colour180
set-option -g status-bg colour235
set-option -g status-interval 5

# Status bar left side - session info
set-option -g status-left-length 40
set-option -g status-left "#[fg=colour235,bg=colour143,bold] #S #[fg=colour143,bg=colour235]"

# Status bar right side - system info
set-option -g status-right-length 80
set-option -g status-right "#[fg=colour144,bg=colour235] %Y-%m-%d #[fg=colour180]%H:%M #[fg=colour179,bg=colour235]#[fg=colour235,bg=colour179,bold] #h "

# Window status styling
set-window-option -g window-status-fg colour144
set-window-option -g window-status-bg colour235
set-window-option -g window-status-current-fg colour235
set-window-option -g window-status-current-bg colour109
set-window-option -g window-status-current-attr bold
set-window-option -g window-status-activity-fg colour167
set-window-option -g window-status-activity-bg colour235

# Window status format (#F instead of the #{window_flags} conditional)
set-window-option -g window-status-format " #I:#W#F "
set-window-option -g window-status-current-format " #I:#W#F "

# Pane border colors
set-option -g pane-border-fg colour243
set-option -g pane-active-border-fg colour109

# Message styling: plain fg on bg, like tmux-modern.conf
set-option -g message-fg colour180
set-option -g message-bg colour235
set-option -g message-attr none
set-option -g message-command-fg colour143
set-option -g message-command-bg colour235

# Copy mode styling
set-window-option -g mode-fg colour235
set-window-option -g mode-bg colour180

# Clock mode color
set-window-option -g clock-mode-colour colour143

# ============================================================================
# Key Bindings
# ============================================================================

# Same keys as tmux-modern.conf: new windows and splits start in the current
# pane's directory. 1.9+ expands #{pane_current_path}; 1.8 has no formats in
# -c, but documents an empty -c as "current pane's directory".
if-shell 'sh ~/.config/tmux/tmux-version-ge 1.9' 'bind c new-window -c "#{pane_current_path}" ; bind "\"" split-window -c "#{pane_current_path}" ; bind % split-window -h -c "#{pane_current_path}" ; bind | split-window -h -c "#{pane_current_path}" ; bind "\\" split-window -h -c "#{pane_current_path}" ; bind - split-window -v -c "#{pane_current_path}"' 'bind c new-window -c "" ; bind "\"" split-window -c "" ; bind % split-window -h -c "" ; bind | split-window -h -c "" ; bind "\\" split-window -h -c "" ; bind - split-window -v -c ""'

# Shift+PgUp scrolls back without the prefix. Modern uses `-eu` (leave copy
# mode on scrolling back to the bottom); -e arrived in 2.1.
if-shell 'sh ~/.config/tmux/tmux-version-ge 2.1' 'bind -n S-PPage copy-mode -eu' 'bind -n S-PPage copy-mode -u'

# Mod-free selection keys, plus Miryoku's default clipboard keys
# (Copy = C-Insert, Cut = S-Delete). Same keys as tmux-modern.conf, in the
# pre-2.4 emacs-copy table.
bind -t emacs-copy v    begin-selection
bind -t emacs-copy y    copy-selection
bind -t emacs-copy C-IC copy-selection
bind -t emacs-copy S-DC copy-selection
